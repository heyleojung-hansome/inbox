<title>돌돌 바둑교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one column app shell, tabs on top; game screens = wooden board left + coach sidebar right (stacks on phones) */
:root{
  --bg:#EAF4EF; --surface:#FFFFFF; --surface-2:#F3F8F5; --ink:#1D2B38; --muted:#5A6B78; --line:#D2E2DA;
  --accent:#F0A630; --accent-ink:#4A2E00; --leaf:#2A9466; --leaf-soft:#D8F0E4; --danger:#D9483A; --danger-soft:#FBE3DF;
  --sky:#3D8BD9; --wood:#E2B263; --wood-2:#D29E4C; --wood-ink:#5C3D12; --stone-shadow:rgba(40,25,5,.35);
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13212A; --surface:#1B2C37; --surface-2:#213542; --ink:#EAF2F5; --muted:#A1B3BE; --line:#2C4250;
  --accent:#F5B54E; --accent-ink:#2E1C00; --leaf:#4CC48F; --leaf-soft:#1E3F33; --danger:#FF7563; --danger-soft:#43231F;
  --sky:#6AAEF0; --wood:#D6A65A; --wood-2:#C08F42; --wood-ink:#4A300A; --stone-shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13212A; --surface:#1B2C37; --surface-2:#213542; --ink:#EAF2F5; --muted:#A1B3BE; --line:#2C4250;
  --accent:#F5B54E; --accent-ink:#2E1C00; --leaf:#4CC48F; --leaf-soft:#1E3F33; --danger:#FF7563; --danger-soft:#43231F;
  --sky:#6AAEF0; --wood:#D6A65A; --wood-2:#C08F42; --wood-ink:#4A300A; --stone-shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.6}
.app{max-width:1120px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:clamp(26px,5vw,36px)}
.brand p{margin:0;color:var(--muted);font-size:15px}
.mascot{flex:none;display:inline-block}
.ghost-btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 20px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:0;transition:transform .12s,border-color .12s}
.tab b{font-family:var(--font-display);font-weight:400;font-size:20px}
.tab span{font-size:13px;color:var(--muted)}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:var(--accent-ink)}
@media (max-width:640px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.tab b{font-size:18px}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px}
.muted{color:var(--muted)}
.btn{border:none;border-radius:14px;padding:10px 16px;font-family:var(--font-display);font-size:17px;background:var(--surface-2);border:2px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.warm{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Lessons ---------- */
.learn-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress{min-width:200px;flex:1;max-width:360px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lesson-card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;transition:transform .12s,border-color .12s}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.lesson-card .num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;background:var(--surface-2);border:2px solid var(--line)}
.lesson-card.done .num{background:var(--leaf);border-color:var(--leaf);color:#fff}
.lesson-card b{font-family:var(--font-display);font-weight:400;font-size:18px;display:block}
.lesson-card small{color:var(--muted);font-size:13px}
.lp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:18px;align-items:start}
@media (max-width:860px){.lp{grid-template-columns:minmax(0,1fr)}}
.lp-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.done{background:var(--leaf)}
.story{font-size:16px}
.story b{color:var(--leaf)}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .say{flex:1;min-width:0;background:var(--surface-2);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px}
.feedback{border-radius:14px;padding:10px 12px;font-weight:700}
.feedback.good{background:var(--leaf-soft);color:var(--ink);border:2px solid var(--leaf)}
.feedback.bad{background:var(--danger-soft);color:var(--ink);border:2px solid var(--danger)}
.choices{display:grid;gap:8px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;font-size:16px}
.choice:hover{border-color:var(--accent)}
.choice.right{border-color:var(--leaf);background:var(--leaf-soft)}
.choice.wrong{border-color:var(--danger);background:var(--danger-soft)}

/* ---------- Board ---------- */
.board-wrap{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px;min-width:0}
.board-host svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board-host.locked svg{cursor:default}
.board-host svg{cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hint-ring{animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.hint-ring{animation:none}.tab,.lesson-card,.btn{transition:none}}
.result{position:absolute;inset:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 82%,transparent);border-radius:16px;backdrop-filter:blur(2px)}
.result .box{background:var(--surface);border:3px solid var(--accent);border-radius:20px;padding:20px;max-width:360px;width:calc(100% - 32px);text-align:center;display:grid;gap:10px}
.result h3{font-size:28px}
.result table{margin:0 auto;border-collapse:collapse;font-variant-numeric:tabular-nums}
.result td{padding:2px 10px;text-align:right}
.result td:first-child{text-align:left}

/* ---------- Game ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,370px);gap:18px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status h3{font-size:22px}
.caps{display:flex;gap:8px}
.cap{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;font-variant-numeric:tabular-nums;font-size:15px}
.stone-ico{width:20px;height:20px;border-radius:50%;display:inline-block;flex:none}
.stone-ico.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.stone-ico.w{background:radial-gradient(circle at 35% 30%,#fff,#d6d6d6 70%);border:1px solid #aaa}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lv{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.2;position:relative}
.lv b{font-family:var(--font-display);font-weight:400;font-size:20px}
.lv small{font-size:11px;color:var(--muted);white-space:nowrap}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.lv[aria-pressed="true"] small{color:var(--accent-ink)}
.lv .star{position:absolute;top:1px;right:5px;font-size:12px;color:var(--accent)}
.lv[aria-pressed="true"] .star{color:var(--accent-ink)}
.label{font-size:13px;color:var(--muted);margin:10px 0 6px;letter-spacing:.02em}
.label:first-child{margin-top:0}
.toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--leaf)}
.thinking{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
details.settings summary{cursor:pointer;font-family:var(--font-display);font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:"설정 펼치기";font-family:var(--font-body);font-size:13px;color:var(--muted)}
details.settings[open] summary::after{content:"접기"}
details.settings[open] summary{margin-bottom:10px}

/* ---------- Coach ---------- */
.coach{display:flex;flex-direction:column;gap:10px;min-width:0}
.coach-head{display:flex;align-items:center;gap:10px}
.coach-head h3{font-size:20px}
.coach-head small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.feed{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px;scroll-behavior:smooth}
.feed.tall{max-height:min(56vh,520px);min-height:260px}
.msg{max-width:92%;padding:8px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.msg.dol{background:var(--surface-2);border:2px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.msg.ai{background:var(--leaf-soft);border:2px solid var(--leaf);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px;align-self:flex-end}
.msg .who{display:block;font-size:12px;font-weight:700;opacity:.75}
.msg .speak{border:none;background:none;padding:2px;margin-left:6px;vertical-align:middle;opacity:.7}
.msg .speak:hover{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:14px}
.chip:hover{border-color:var(--leaf)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px}
.teacher{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:18px;align-items:start}
@media (max-width:860px){.teacher{grid-template-columns:minmax(0,1fr)}}
.tips{display:grid;gap:10px}
.tips h3{font-size:20px}
.tips ol{margin:0;padding-left:20px;display:grid;gap:6px}
.note{font-size:13px;color:var(--muted)}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mascot" data-mascot="56"></span>
      <div><h1>돌돌 바둑교실</h1><p>처음 만나는 바둑, 돌돌이랑 차근차근 배워요</p></div>
    </div>
    <button id="soundBtn" class="ghost-btn" aria-pressed="true">소리 켜짐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="learn"><b>배우기</b><span>처음부터 차근차근</span></button>
    <button class="tab" role="tab" data-tab="practice"><b>연습게임</b><span>힌트 받으며 연습</span></button>
    <button class="tab" role="tab" data-tab="match"><b>실전게임</b><span>AI 1~10단계와 대결</span></button>
    <button class="tab" role="tab" data-tab="teacher"><b>AI 선생님</b><span>무엇이든 물어봐요</span></button>
  </nav>

  <main>
    <section id="view-learn">
      <div id="lessonHome">
        <div class="learn-head">
          <div><h2 style="font-size:26px">바둑 배우기 12단계</h2><p class="muted" style="margin:0">하나씩 눌러서 직접 돌을 놓아 보며 배워요.</p></div>
          <div class="progress"><div class="row" style="justify-content:space-between"><small id="progText" class="muted"></small></div><div class="bar"><i id="progBar" style="width:0"></i></div></div>
        </div>
        <div id="lessonList" class="lesson-grid"></div>
      </div>
      <div id="lessonPlayer" hidden>
        <div class="row" style="margin-bottom:12px;justify-content:space-between">
          <button class="btn" id="lpBack">← 레슨 목록</button>
          <div class="dots" id="lpDots"></div>
        </div>
        <div class="lp">
          <div class="board-wrap"><div class="board-host" id="lpBoard"></div></div>
          <div class="lp-side">
            <div class="card" style="display:grid;gap:10px">
              <div><small class="muted" id="lpNum"></small><h2 id="lpTitle" style="font-size:26px"></h2></div>
              <div class="story" id="lpStory"></div>
              <div class="bubble"><span class="mascot" data-mascot="40"></span><div class="say" id="lpTask"></div></div>
              <div class="choices" id="lpChoices" hidden></div>
              <div class="feedback" id="lpFeedback" hidden></div>
              <div class="row">
                <button class="btn" id="lpRetry">다시 하기</button>
                <button class="btn primary" id="lpNext" hidden>다음 →</button>
              </div>
            </div>
            <div class="card" id="lpCoach"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="view-practice" hidden></section>
    <section id="view-match" hidden></section>
    <section id="view-teacher" hidden>
      <div class="teacher">
        <div class="card" id="teacherCoach"></div>
        <div class="card tips">
          <h3>바둑 기본 약속 5가지</h3>
          <ol>
            <li>흑이 먼저, 한 번씩 번갈아 둬요.</li>
            <li>돌은 줄이 만나는 점에 놓아요.</li>
            <li>숨구멍을 모두 막으면 돌을 잡아요.</li>
            <li>숨구멍이 없는 곳엔 못 둬요. 상대를 잡을 땐 괜찮아요.</li>
            <li>끝나면 내 돌과 집을 세어서 많은 쪽이 이겨요.</li>
          </ol>
          <p class="note" id="aiNote"></p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
/* ================= Engine ================= */
const LET = "ABCDEFGHJKLMNOPQRST";
const PASS = -1;
const MARK = new Int32Array(1024), LMARK = new Int32Array(1024);
let STAMP = 0;

class Go {
  constructor(n) {
    this.n = n; this.W = n + 2;
    this.c = new Uint8Array(this.W * this.W).fill(3);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) this.c[this.p(x, y)] = 0;
    this.ko = -1; this.caps = [0, 0, 0]; this.dirs = [1, -1, this.W, -this.W];
  }
  p(x, y) { return (y + 1) * this.W + x + 1; }
  xy(p) { return [p % this.W - 1, ((p / this.W) | 0) - 1]; }
  clone() {
    const g = Object.create(Go.prototype);
    g.n = this.n; g.W = this.W; g.c = this.c.slice(); g.ko = this.ko; g.caps = this.caps.slice(); g.dirs = this.dirs;
    return g;
  }
  name(p) { if (p === PASS) return "쉬기"; const [x, y] = this.xy(p); return LET[x] + (this.n - y); }
  parse(s) { const x = LET.indexOf(s[0]); const r = parseInt(s.slice(1), 10); return this.p(x, this.n - r); }
  group(p) {
    const col = this.c[p], s = ++STAMP, st = [p], stones = [];
    MARK[p] = s; let libs = 0, lib = -1; const libPts = [];
    while (st.length) {
      const q = st.pop(); stones.push(q);
      for (let i = 0; i < 4; i++) {
        const r = q + this.dirs[i], v = this.c[r];
        if (v === 0) { if (LMARK[r] !== s) { LMARK[r] = s; libs++; lib = r; libPts.push(r); } }
        else if (v === col && MARK[r] !== s) { MARK[r] = s; st.push(r); }
      }
    }
    return { stones, libs, lib, libPts };
  }
  play(p, col) {
    if (p === PASS) { this.ko = -1; return []; }
    if (this.c[p] !== 0 || p === this.ko) return null;
    const opp = 3 - col; this.c[p] = col; const cap = [];
    for (let i = 0; i < 4; i++) {
      const q = p + this.dirs[i];
      if (this.c[q] === opp) { const g = this.group(q); if (g.libs === 0) for (const s of g.stones) { this.c[s] = 0; cap.push(s); } }
    }
    const me = this.group(p);
    if (me.libs === 0) { this.c[p] = 0; return null; }
    this.ko = (cap.length === 1 && me.stones.length === 1 && me.libs === 1) ? cap[0] : -1;
    this.caps[col] += cap.length;
    return cap;
  }
  legal(p, col) {
    if (p === PASS) return true;
    if (this.c[p] !== 0 || p === this.ko) return false;
    for (let i = 0; i < 4; i++) if (this.c[p + this.dirs[i]] === 0) return true;
    const opp = 3 - col;
    for (let i = 0; i < 4; i++) {
      const q = p + this.dirs[i], v = this.c[q];
      if (v === col) { if (this.group(q).libs > 1) return true; }
      else if (v === opp) { if (this.group(q).libs === 1) return true; }
    }
    return false;
  }
  whyIllegal(p, col) {
    if (this.c[p] !== 0) return "occupied";
    if (p === this.ko) return "ko";
    if (!this.legal(p, col)) return "suicide";
    return null;
  }
  eyeish(p, col) {
    for (let i = 0; i < 4; i++) { const v = this.c[p + this.dirs[i]]; if (v !== col && v !== 3) return false; }
    const W = this.W; let bad = 0, edge = 0;
    for (const d of [W + 1, W - 1, -W + 1, -W - 1]) { const v = this.c[p + d]; if (v === 3) edge = 1; else if (v === 3 - col) bad++; }
    return edge ? bad === 0 : bad < 2;
  }
  empties() {
    const r = [], n = this.n, W = this.W;
    for (let y = 0; y < n; y++) { let p = (y + 1) * W + 1; for (let x = 0; x < n; x++, p++) if (this.c[p] === 0) r.push(p); }
    return r;
  }
  points() { const r = []; for (let y = 0; y < this.n; y++) for (let x = 0; x < this.n; x++) r.push(this.p(x, y)); return r; }
  atariGroups(col) {
    const seen = new Uint8Array(this.c.length), res = [];
    for (const p of this.points()) {
      if (this.c[p] === col && !seen[p]) { const g = this.group(p); for (const s of g.stones) seen[s] = 1; if (g.libs === 1) res.push(g); }
    }
    return res;
  }
  areaMap() {
    const own = new Int8Array(this.c.length), seen = new Uint8Array(this.c.length);
    for (const p of this.points()) {
      const v = this.c[p];
      if (v === 1) own[p] = 1; else if (v === 2) own[p] = -1;
      else if (!seen[p]) {

async function localAnswer(q, ctx) {
  if (ctx && ctx.hint && /어디|다음|추천|힌트|좋은 수|좋아요\?/.test(q)) return await ctx.hint();
  if (ctx && ctx.danger && /위험|잡혀|괜찮/.test(q)) return ctx.danger();
  for (const [re, a] of LOCAL) if (re.test(q)) return a;
  return "돌돌이는 '규칙', '단수', '숨구멍', '집', '패', '눈', '덤' 같은 낱말을 알아들어요. Claude 앱에서 이 페이지를 열면 AI 선생님이 무엇이든 대답해 줄 거예요!";
}

let ttsObj = null; TTS.then(t => { ttsObj = t; document.querySelectorAll(".speak").forEach(b => b.hidden = !t); });

class Coach {
  constructor(root, { title, sub, chips = [], ctx = () => ({}), tall = false, intro }) {
    this.ctx = ctx; this.turns = []; this.busy = false;
    root.classList.add("coach");
    root.innerHTML = `<div class="coach-head"><span class="mascot">${mascotSVG(40)}</span><div><h3>${esc(title)}</h3><small>${esc(sub)}</small></div></div>
      <div class="feed ${tall ? "tall" : ""}" aria-live="polite"></div>
      <div class="chips"></div>
      <form class="ask"><input type="text" placeholder="궁금한 걸 적어 보세요" aria-label="질문 적기" maxlength="300" id="ask-${Math.random().toString(36).slice(2, 8)}"><button class="btn primary" type="submit">묻기</button></form>`;
    this.feed = $(".feed", root); this.input = $("input", root); this.btn = $("button[type=submit]", root);
    const chipBox = $(".chips", root);
    for (const c of chips) { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c; b.onclick = () => this.ask(c); chipBox.appendChild(b); }
    $("form", root).addEventListener("submit", e => {
      e.preventDefault();
      if (this.busy && this.ctl) { this.ctl.abort(); return; }
      const q = this.input.value.trim(); if (!q) return; this.input.value = ""; this.ask(q);
    });
    if (intro) this.say(intro);
  }
  add(who, text) {
    const d = document.createElement("div"); d.className = "msg " + who;
    const name = who === "me" ? "나" : who === "ai" ? "AI 선생님" : "돌돌이";
    d.innerHTML = `<span class="who">${name}</span><span class="txt"></span>`;
    $(".txt", d).textContent = text;
    if (who !== "me") {
      const b = document.createElement("button"); b.type = "button"; b.className = "speak"; b.title = "읽어 주기"; b.setAttribute("aria-label", "소리로 읽어 주기");
      b.innerHTML = SPEAK_ICON; b.hidden = !ttsObj;
      b.onclick = () => { if (ttsObj) ttsObj.speak($(".txt", d).textContent.slice(0, 1900), { language: "ko" }).catch(() => { }); };
      $(".who", d).appendChild(b);
    }
    this.feed.appendChild(d); this.feed.scrollTop = this.feed.scrollHeight;
    return $(".txt", d);
  }
  say(text) { this.add("dol", text); }
  clear() { this.feed.innerHTML = ""; this.turns = []; }
  setBusy(b) { this.busy = b; this.btn.textContent = b ? "멈추기" : "묻기"; }
  async ask(q, opts = {}) {
    if (this.busy) return;
    this.add("me", opts.label || q);
    const out = this.add("ai", "");
    out.innerHTML = `생각 중<span class="thinking"><i></i><i></i><i></i></span>`;
    this.setBusy(true);
    const ctx = await Promise.resolve(this.ctx());
    const s = sampleBlocked ? null : await SAMPLE;
    if (!s) { out.parentElement.className = "msg dol"; $(".who", out.parentElement).firstChild.textContent = "돌돌이"; out.textContent = await localAnswer(q, ctx); this.feed.scrollTop = this.feed.scrollHeight; this.setBusy(false); return; }
    const content = `${q}\n\n${ctx.text || ""}`.trim();
    const turns = [{ role: "user", content: RULES }, ...this.turns.slice(-8), { role: "user", content }];
    this.ctl = new AbortController();
    try {
      const { text } = await s(turns, { cache: false, signal: this.ctl.signal, modelTier: opts.tier || "default", onText: ({ text }) => { out.textContent = text; this.feed.scrollTop = this.feed.scrollHeight; } });
      out.textContent = text;
      this.turns.push({ role: "user", content: q }, { role: "assistant", content: text });
    } catch (e) {
      const code = e && e.code;
      if (code === "cancelled") out.textContent = (e.text || "") + (e.text ? "" : "멈췄어요.");
      else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
        sampleBlocked = true; out.parentElement.className = "msg dol"; $(".who", out.parentElement).firstChild.textContent = "돌돌이";
        out.textContent = await localAnswer(q, ctx);
      } else if (code === "rate_limited") out.textContent = (e.text || "") + "\n(AI 선생님이 잠깐 쉬는 중이에요. 조금 뒤에 다시 물어봐 주세요.)";
      else if (code === "refused") out.textContent = "그 질문에는 대답하기 어려워요. 바둑 이야기를 해 볼까요?";
      else out.textContent = (e && e.text ? e.text + "\n" : "") + "(연결이 잠깐 끊겼어요. 다시 물어봐 주세요.)";
    } finally { this.setBusy(false); this.ctl = null; this.feed.scrollTop = this.feed.scrollHeight; }
  }
}

const LP = {
  i: 0, st: 0, g: null, view: null, busy: false,
  init() {
    this.view = new BoardView($("#lpBoard"), p => this.click(p));
    $("#lpBack").onclick = () => this.home();
    $("#lpRetry").onclick = () => this.load();
    $("#lpNext").onclick = () => this.next();
    this.coach = new Coach($("#lpCoach"), {
      title: "모르겠으면 물어봐요", sub: "이 레슨에 대해 AI 선생님께 질문해요",
      chips: ["무슨 뜻이에요?", "힌트 주세요", "왜 그래요?"],
      ctx: () => {
        const L = LESSONS[this.i], s = L.stages[this.st];
        return {
          text: `[상황] 아이가 '배우기' ${this.i + 1}단계 "${L.t}" 레슨을 하고 있어.\n[레슨 설명] ${L.story.replace(/<[^>]+>/g, "")}\n[지금 할 일] ${s.task}\n${s.hint ? "[정답 힌트(정답을 바로 말하지 말고 생각을 도와줘)] " + s.hint + "\n" : ""}[판]\n${this.g.ascii()}`,
          hint: async () => s.hint || "레슨 설명을 천천히 다시 읽어 보세요. 돌돌이가 응원할게요!"
        };
      }
    });
    this.renderList();
  },
  renderList() {
    const box = $("#lessonList"); box.innerHTML = "";
    let done = 0;
    LESSONS.forEach((L, i) => {
      const d = !!DATA.lessons[i]; if (d) done++;
      const b = document.createElement("button"); b.className = "lesson-card" + (d ? " done" : "");
      b.innerHTML = `<span class="num">${d ? "✓" : i + 1}</span><span><b>${esc(L.t)}</b><small>${esc(L.sub)}</small></span>`;
      b.onclick = () => this.open(i); box.appendChild(b);
    });
    $("#progText").textContent = `${LESSONS.length}개 중 ${done}개 완료`;
    $("#progBar").style.width = (done / LESSONS.length * 100) + "%";
  },
  home() { $("#lessonPlayer").hidden = true; $("#lessonHome").hidden = false; this.renderList(); },
  open(i) {
    this.i = i; this.st = 0; $("#lessonHome").hidden = true; $("#lessonPlayer").hidden = false;
    this.coach.clear(); this.load(); window.scrollTo({ top: 0, behavior: "smooth" });
  },
  load() {
    const L = LESSONS[this.i], s = L.stages[this.st];
    const g = new Go(s.size);
    (s.b || []).forEach(c => g.c[g.parse(c)] = 1);
    (s.w || []).forEach(c => g.c[g.parse(c)] = 2);
    g.ko = s.ko ? g.parse(s.ko) : -1;
    this.g = g; this.found = new Set(); this.count = 0; this.done = false; this.busy = false; this.last = null; this.flash = null;
    $("#lpNum").textContent = `${this.i + 1}단계`;
    $("#lpTitle").textContent = L.t;
    $("#lpStory").innerHTML = L.story;
    $("#lpTask").textContent = s.task;
    $("#lpFeedback").hidden = true; $("#lpNext").hidden = true;
    const dots = $("#lpDots"); dots.innerHTML = L.stages.map((_, k) => `<i class="${k < this.st ? "done" : k === this.st ? "on" : ""}"></i>`).join("");
    const ch = $("#lpChoices");
    if (s.mode === "quiz") {
      ch.hidden = false; ch.innerHTML = "";
      s.choices.forEach((c, k) => { const b = document.createElement("button"); b.className = "choice"; b.textContent = c; b.onclick = () => this.answer(k, b); ch.appendChild(b); });
    } else ch.hidden = true;
    this.draw();
  },
  draw() {
    const s = LESSONS[this.i].stages[this.st];
    const marks = [];
    (s.marks || []).forEach(m => marks.push({ p: this.g.parse(m.p), t: m.t }));
    let k = 0; this.found.forEach(p => marks.push({ p, t: "lib", label: ++k }));
    if (this.flash != null) marks.push({ p: this.flash, t: "x" });
    const terr = s.terr ? this.g.areaMap() : null;
    this.view.draw(this.g, { interactive: !this.done && s.mode !== "quiz" && !this.busy, marks, last: this.last, terr, ghost: 1 });
  },
  fb(text, good) {
    const f = $("#lpFeedback"); f.hidden = false; f.className = "feedback " + (good ? "good" : "bad"); f.textContent = text;
  },
  success() {
    const L = LESSONS[this.i], s = L.stages[this.st];
    this.done = true; chime(true); this.fb(s.ok, true);
    const nb = $("#lpNext"); nb.hidden = false;
    if (this.st === L.stages.length - 1) {
      DATA.lessons[this.i] = true; saveData();
      nb.textContent = this.i < LESSONS.length - 1 ? "다음 레슨으로 →" : "연습게임 하러 가기 →";
    } else nb.textContent = "다음 →";
    this.draw();
  },
  next() {
    const L = LESSONS[this.i];
    if (this.st < L.stages.length - 1) { this.st++; this.load(); }
    else if (this.i < LESSONS.length - 1) this.open(this.i + 1);
    else { this.home(); go("practice"); }
  },
  answer(k, btn) {
    if (this.done) return;
    const s = LESSONS[this.i].stages[this.st];
    if (k === s.answer) { btn.classList.add("right"); this.success(); }
    else { btn.classList.add("wrong"); chime(false); this.fb(s.hint || "다시 생각해 봐요!", false); }
  },
  wrongFlash(p, msg) {
    chime(false); this.fb(msg, false); this.flash = p; this.draw();
    setTimeout(() => { this.flash = null; if (!this.done) this.draw(); }, 700);
  },
  click(p) {
    if (this.done || this.busy) return;
    const s = LESSONS[this.i].stages[this.st], g = this.g;
    const placeIfLegal = () => {
      const why = g.whyIllegal(p, 1);
      if (why) { this.wrongFlash(p, why === "occupied" ? "이미 돌이 있는 곳이에요. 빈 점을 골라요." : why === "ko" ? "패라서 지금은 바로 다시 따낼 수 없어요." : "거기는 숨구멍이 없어서 둘 수 없어요."); return null; }
      const cap = g.play(p, 1); clack(); this.last = p; return cap;
    };
    switch (s.mode) {
      case "any": if (placeIfLegal()) this.success(); break;
      case "point": {
        if (s.targets.map(t => g.parse(t)).includes(p) && g.legal(p, 1)) { g.play(p, 1); clack(); this.last = p; this.success(); }
        else this.wrongFlash(p, s.hint || "다른 곳을 찾아봐요.");
        break;
      }
      case "capture": {
        if (g.c[p] !== 0 || !g.legal(p, 1)) { this.wrongFlash(p, g.c[p] ? "이미 돌이 있는 곳이에요." : "거기는 둘 수 없어요. " + (s.hint || "")); break; }
        const snap = g.clone(); const cap = g.play(p, 1); clack(); this.last = p;
        if (cap.length) { this.success(); }
        else { this.draw(); this.busy = true; this.fb("아직 못 잡았어요. " + (s.hint || ""), false); chime(false);
          setTimeout(() => { this.g = snap; this.last = null; this.busy = false; this.draw(); }, 1100); }
        break;
      }
      case "escape": {
        if (g.c[p] !== 0 || !g.legal(p, 1)) { this.wrongFlash(p, "거기는 둘 수 없어요."); break; }
        const snap = g.clone(); g.play(p, 1); clack(); this.last = p;
        const gr = g.group(g.parse(s.target));
        if (g.c[g.parse(s.target)] === 1 && gr.libs >= 2) this.success();
        else { this.draw(); this.busy = true; this.fb("아직 단수예요! " + (s.hint || ""), false); chime(false);
          setTimeout(() => { this.g = snap; this.last = null; this.busy = false; this.draw(); }, 1100); }
        break;
      }
      case "libs": {
        const gr = g.group(g.parse(s.target));
        if (gr.libPts.includes(p)) {
          if (!this.found.has(p)) { this.found.add(p); clack(); }
          if (this.found.size === gr.libs) this.success();
          else { this.fb(`${this.found.size}개 찾았어요! 더 있어요.`, true); this.draw(); }
        } else this.wrongFlash(p, "거기는 숨구멍이 아니에요. 흰 돌과 선으로 바로 이어진 빈 점을 찾아요.");
        break;
      }
      case "illegal": {
        if (p === g.parse(s.target)) { chime(false); this.flash = p; this.success(); this.flash = null; setTimeout(() => this.draw(), 10); }
        else this.wrongFlash(p, s.hint);
        break;
      }
      case "turns": {
        if (!placeIfLegal()) break;
        this.count++;
        if (this.count >= s.n) { this.success(); break; }
        this.busy = true; this.fb(`${this.count}번 뒀어요. 이제 백 차례!`, true); this.draw();
        setTimeout(() => { const m = randomPick(g, 2); if (m.p !== PASS) { g.play(m.p, 2); clack(); this.last = m.p; } this.busy = false; this.fb("이제 다시 흑 차례예요.", true); this.draw(); }, 600);
        break;
      }
      case "capturego": {
        const cap = placeIfLegal(); if (!cap) break;
        if (cap.length) { this.success(); break; }
        this.busy = true; this.draw();
        setTimeout(async () => {
          const m = await chooseMove(g, 2, s.level, { capMode: true, moveNo: 0 });
          let c2 = [];
          if (m.p !== PASS) { c2 = g.play(m.p, 2); clack(); this.last = m.p; }
          this.busy = false;
          if (c2 && c2.length) { this.done = true; chime(false); this.fb(s.fail, false); }
          else { const at = g.atariGroups(1); this.fb(at.length ? "조심! 흑돌이 단수예요. 도망가요!" : "흑 차례예요. 잡을 수 있는 백돌이 있나 살펴봐요.", !at.length); }
          this.draw();
        }, 450);
        break;
      }
    }
  }
};

  }
  get capMode() { return this.cfg.mode.startsWith("cap"); }
  renderSettings() {
    this.q(".s-mode").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === this.mode));

    this.q(".s-lv").innerHTML = Array.from({ length: 10 }, (_, k) => k + 1).map(l => `<button class="lv" data-v="${l}" aria-pressed="${l === this.level}" title="${l}단계 ${LV_NAMES[l]}">${wins.includes(l) ? '<span class="star">★</span>' : ""}<b>${l}</b><small>${LV_NAMES[l]}</small></button>`).join("");
  }
  newGame(first) {
    this.cfg = { mode: this.mode, level: this.level };
    const size = this.mode === "cap5" ? 5 : this.mode === "cap7" ? 7 : +this.mode;
    this.g = new Go(size); this.komi = this.capMode ? 0 : 6.5;
    this.moves = []; this.passes = 0; this.over = false; this.busy = false; this.snaps = []; this.hintP = null; this.result = null; this.last = null; this.final = null;
    this.q(".result").hidden = true;
    this.coach.clear();
    const lv = `${this.cfg.level}단계 ${LV_NAMES[this.cfg.level]}`;
    this.coach.say(this.capMode
      ? `따먹기 바둑 시작! 상대는 ${lv}예요. 먼저 돌 하나를 잡으면 이겨요. 흑인 내가 먼저 둬요.`
      : `${size}줄 바둑 시작! 상대는 ${lv}예요. 흑인 내가 먼저 둬요. 둘 곳이 없으면 '쉬기'를 눌러요.`);
    if (!first && window.innerWidth < 900) this.q(".settings").open = false;
    this.render();
  }
  context() {
    const g = this.g, toMove = this.over ? "끝남" : this.busy ? "백" : "흑";
    const atB = g.atariGroups(1).map(gr => `${gr.stones.map(s => g.name(s)).join(",")}(남은 숨구멍 ${g.name(gr.lib)})`);
    const atW = g.atariGroups(2).map(gr => `${gr.stones.map(s => g.name(s)).join(",")}(남은 숨구멍 ${g.name(gr.lib)})`);
    let analysis = `단수인 흑돌: ${atB.join(" / ") || "없음"}. 단수인 백돌: ${atW.join(" / ") || "없음"}.`;
    if (this.practice && !this.over) {
      const top = rankMoves(g, 1, { capMode: this.capMode, moveNo: this.moves.length })[0];
      if (top) analysis += ` 엔진 추천 수(흑): ${g.name(top.p)} - ${WHY[top.why] || ""}`;
    }
    if (!this.capMode && this.moves.length > 6) {
      const e = estimate(g, 1, this.komi, 40);
      analysis += ` 대략적인 형세(덤 포함): ${e.diff > 0 ? "흑" : "백"}이 약 ${Math.abs(e.diff).toFixed(1)}점 앞섬(정확하지 않음).`;
    }
    const recent = this.moves.slice(-6).map(m => `${m.c === 1 ? "흑" : "백"} ${m.name}`).join(", ");
    const res = this.result ? `\n[결과] ${this.result}` : "";
    const text = `[게임] ${this.practice ? "연습게임" : "실전게임"}, ${this.capMode ? "따먹기 바둑(먼저 잡으면 승리)" : `${g.n}줄 바둑, 덤 ${this.komi}`}. 상대는 백 AI ${this.cfg.level}단계(${LV_NAMES[this.cfg.level]}).
${this.practice ? "" : "[규칙] 실전게임이라 정확한 좌표의 정답은 알려 주지 말고, 무엇을 살펴보면 좋을지 생각할 거리만 줘.\n"}[판]
${g.ascii()}[수] 지금 ${this.moves.length}수째, 차례: ${toMove}. 최근 수: ${recent || "없음"}. 잡은 돌: 흑 ${g.caps[1]}개, 백 ${g.caps[2]}개.
[분석] ${analysis}${res}`;
    return {
      text,
      hint: this.practice ? async () => { const m = await this.findHint(); return m.p === PASS ? "지금은 '쉬기'를 해도 좋아요." : `${g.name(m.p)}을 봐요. ${WHY[m.why] || ""}`; } : null,
      danger: () => atB.length ? `조심! ${atB.join(", ")} 흑돌이 단수예요.` : "지금은 단수인 흑돌이 없어요. 잘하고 있어요!"
    };
  }
  render() {
    const g = this.g, marks = [];
    if (this.practice && this.help && !this.over) {
      for (const gr of g.atariGroups(1)) for (const s of gr.stones) marks.push({ p: s, t: "danger" });
      for (const gr of g.atariGroups(2)) for (const s of gr.stones) marks.push({ p: s, t: "chance" });
    }
    if (this.hintP != null && this.hintP !== PASS) marks.push({ p: this.hintP, t: "hint" });
    this.view.draw(g, { interactive: !this.over && !this.busy, marks, last: this.last, ghost: 1, terr: this.final ? this.final.map : null, dead: this.final ? this.final.dead : null });
    this.q(".cb").textContent = g.caps[1]; this.q(".cw").textContent = g.caps[2];
    const st = this.q(".st-text"), sub = this.q(".st-sub");
    if (this.over) { st.textContent = "게임 끝!"; sub.textContent = this.result || ""; }
    else if (this.busy) { st.innerHTML = `${esc(this.busyText || "백이 생각 중")}<span class="thinking"><i></i><i></i><i></i></span>`; sub.textContent = `상대: ${this.cfg.level}단계 ${LV_NAMES[this.cfg.level]}`; }
    else { st.textContent = "내 차례 (흑)"; sub.textContent = `${this.moves.length + 1}번째 수 · 상대: ${this.cfg.level}단계 ${LV_NAMES[this.cfg.level]}`; }
    this.q(".b-pass").disabled = this.over || this.busy || this.capMode;
    if (this.practice) { this.q(".b-undo").disabled = this.busy || !this.snaps.length; this.q(".b-hint").disabled = this.over || this.busy; }
  }
  human(p) {
    if (this.over || this.busy) return;
    const g = this.g, why = g.whyIllegal(p, 1);
    if (why) {
      if (why !== "occupied") this.coach.say(why === "ko" ? "거기는 패예요! 방금 따낸 자리는 바로 다시 따낼 수 없어요. 다른 곳에 한 번 두고 와요." : "거기는 숨구멍이 없어서 둘 수 없어요. (상대 돌을 잡을 수 있을 때만 둘 수 있어요)");
      return;
    }
    this.snaps.push({ g: g.clone(), moves: this.moves.slice(), passes: this.passes, last: this.last });
    const atWBefore = g.atariGroups(2).length;
    const cap = g.play(p, 1); clack();
    this.moves.push({ c: 1, p, name: g.name(p) }); this.passes = 0; this.last = p; this.hintP = null;
    if (this.capMode && cap.length) return this.end(1, `흑이 먼저 ${cap.length}점을 잡았어요!`);
    if (this.practice) {
      const me = g.group(p);
      if (cap.length) this.coach.say(`와! 백돌을 ${cap.length}개 잡았어요!`);
      else if (me.libs === 1) this.coach.say(`앗, 방금 둔 ${g.name(p)} 돌이 단수예요(숨구멍 1개). 백이 잡을 수 있어요! '무르기'로 다시 둘 수도 있어요.`);
      else if (g.atariGroups(2).length > atWBefore) this.coach.say("좋아요! 백돌을 단수로 만들었어요.");
    }
    this.aiTurn();
  }
  pass() {
    if (this.over || this.busy) return;
    this.snaps.push({ g: this.g.clone(), moves: this.moves.slice(), passes: this.passes, last: this.last });
    this.g.play(PASS, 1); this.moves.push({ c: 1, p: PASS, name: "쉬기" }); this.passes++; this.hintP = null;
    this.coach.say("흑이 쉬었어요. 백도 쉬면 게임이 끝나요.");
    if (this.passes >= 2) return this.end();
    this.aiTurn(true);
  }
  async aiTurn(oppPassed = false) {
    this.busy = true; this.busyText = "백이 생각 중"; this.render();
    const t0 = performance.now(); const g = this.g;
    const m = await chooseMove(g, 2, this.cfg.level, { capMode: this.capMode, moveNo: this.moves.length, komi: this.komi, oppPassed });
    const wait = 350 - (performance.now() - t0); if (wait > 0) await new Promise(r => setTimeout(r, wait));
    if (this.g !== g || this.over) return;
    if (m.p === PASS) {
      g.play(PASS, 2); this.moves.push({ c: 2, p: PASS, name: "쉬기" }); this.passes++;
      this.busy = false;
      if (this.passes >= 2) return this.end();
      this.coach.say("백이 쉬었어요(패스). 나도 더 둘 곳이 없으면 '쉬기'를 눌러서 끝내요.");
      this.render(); return;
    }
    const cap = g.play(m.p, 2); clack();
    this.moves.push({ c: 2, p: m.p, name: g.name(m.p) }); this.passes = 0; this.last = m.p; this.busy = false;
    if (this.capMode && cap.length) return this.end(2, `백이 먼저 ${cap.length}점을 잡았어요.`);
    if (this.practice) {
      const atB = g.atariGroups(1), atW = g.atariGroups(2);
      if (cap.length) this.coach.say(`백이 흑돌 ${cap.length}개를 잡았어요. 숨구멍을 잘 지켜봐요.`);
      if (atB.length) this.coach.say(`조심! ${atB.map(gr => g.name(gr.stones[0])).join(", ")} 흑돌이 단수예요. 이어서 도망가거나 연결해요.`);
      else if (atW.length) this.coach.say(`기회! ${atW.map(gr => g.name(gr.stones[0])).join(", ")} 백돌이 단수예요. 잡을 수 있어요!`);
    }
    if (!this.capMode && this.moves.length >= g.n * g.n * 2.5) return this.end();
    this.render();
  }
  undo() {
    if (this.busy || !this.snaps.length) return;
    const s = this.snaps.pop();
    this.g = s.g; this.moves = s.moves; this.passes = s.passes; this.last = s.last; this.over = false; this.hintP = null; this.final = null; this.result = null;
    this.q(".result").hidden = true;
    this.coach.say("한 수 물렀어요. 다시 생각해서 둬 봐요.");
    this.render();
  }
  async findHint() {
    const g = this.g;
    if (this.capMode) return heuristicPick(g, 1, { capMode: true, moveNo: this.moves.length }, 0);
    return mcSearch(g, 1, this.komi, { ...MC[7], moveNo: this.moves.length, capMode: false });
  }
  async hint() {
    if (this.over || this.busy) return;
    this.busy = true; this.busyText = "돌돌이가 찾는 중"; this.render();
    const g = this.g; const m = await this.findHint();
    if (this.g !== g) return;
    this.busy = false; this.hintP = m.p;
    this.coach.say(m.p === PASS ? "지금은 더 둘 좋은 곳이 없어요. '쉬기'를 눌러도 좋아요." : `초록 동그라미 ${g.name(m.p)}을 봐요! ${WHY[m.why] || ""}`);
    this.render();
  }
  end(winner, why) {
    this.over = true; this.busy = false; this.final = null;
    let text, html;
    if (this.capMode) {
      text = (winner === 1 ? "흑(나) 승리! " : "백 승리. ") + why;
      html = `<h3>${winner === 1 ? "내가 이겼어요!" : "아쉬워요!"}</h3><p style="margin:0">${esc(why)}</p>`;
    } else {
      const f = finalScore(this.g, this.komi); this.final = f;
      winner = f.b > f.w ? 1 : 2;
      const diff = Math.abs(f.b - f.w);
      text = `${winner === 1 ? "흑(나)" : "백"}이 ${diff}점 차이로 이겼어요. 흑 ${f.b}점, 백 ${f.w}점.`;
      html = `<h3>${winner === 1 ? "내가 이겼어요!" : "아쉬워요!"}</h3>
        <table><tr><td></td><td>흑(나)</td><td>백</td></tr>
        <tr><td>판 위의 돌</td><td>${f.bs}</td><td>${f.ws}</td></tr>
        <tr><td>집</td><td>${f.bt}</td><td>${f.wt}</td></tr>
        <tr><td>덤</td><td>0</td><td>${f.komi}</td></tr>
        <tr><td><b>합계</b></td><td><b>${f.b}</b></td><td><b>${f.w}</b></td></tr></table>
        <p class="note" style="margin:0">작은 네모는 집, 흐린 돌은 살 수 없는 돌(죽은 돌)로 셌어요.</p>`;
    }
    this.result = text;
    if (winner === 1) {
      const k = this.kind + this.cfg.mode; DATA.wins[k] = DATA.wins[k] || [];
      if (!DATA.wins[k].includes(this.cfg.level)) DATA.wins[k].push(this.cfg.level); saveData(); this.renderSettings();
    }
    chime(winner === 1);
    const r = this.q(".result");
    r.innerHTML = `<div class="box">${html}
      ${winner === 1 && this.cfg.level < 10 ? `<p style="margin:0">${this.cfg.level}단계 별을 받았어요! 다음은 ${this.cfg.level + 1}단계 ${LV_NAMES[this.cfg.level + 1]}에 도전!</p>` : ""}
      <div class="row" style="justify-content:center">
        <button class="btn" data-a="see">판 보기</button>
        <button class="btn warm" data-a="review">AI 선생님 복기</button>
        <button class="btn primary" data-a="again">${winner === 1 && this.cfg.level < 10 ? "다음 단계" : "다시 하기"}</button>
      </div></div>`;
    r.hidden = false;
    r.onclick = e => {
      const a = e.target.closest("button")?.dataset.a; if (!a) return;
      if (a === "see") r.hidden = true;
      if (a === "again") { if (winner === 1 && this.cfg.level < 10) { this.level = this.cfg.level + 1; this.renderSettings(); } this.newGame(); }
      if (a === "review") { r.hidden = true; this.review(); }
    };
    this.coach.say(text);
    this.render();
  }
  review() {
    const rec = this.moves.map((m, i) => `${i + 1}.${m.c === 1 ? "흑" : "백"} ${m.name}`).join(" ");
    const q = `방금 끝난 게임을 복기해 주세요. 잘한 점 2가지와 다음에 고치면 좋을 점 1~2가지를 쉽게 알려 주세요.\n[기보] ${rec}`;
    this.coach.ask(q, { label: "방금 게임 복기해 주세요!" });
  }
}

LP.init();
let practiceCtl = null, matchCtl = null;
const TABS = ["learn", "practice", "match", "teacher"];
function go(tab, push = true) {
  if (!TABS.includes(tab)) tab = "learn";
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  TABS.forEach(t => $("#view-" + t).hidden = t !== tab);
  if (tab === "practice" && !practiceCtl) practiceCtl = new GameCtl($("#view-practice"), "practice");
  if (tab === "match" && !matchCtl) matchCtl = new GameCtl($("#view-match"), "match");
  if (push && location.hash !== "#" + tab) { try { history.replaceState(null, "", "#" + tab); } catch (e) { location.hash = tab; } }
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => go(b.dataset.tab));
window.addEventListener("hashchange", () => go(location.hash.slice(1), false));
go(location.hash.slice(1) || "learn", false);
