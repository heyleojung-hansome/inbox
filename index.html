<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>씽씽 직업 자동차</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg:#8fd3ff; --panel:#fffaf0; --ink:#2f2a25; --muted:#7a6f63;
  --accent:#ff7a30; --accent2:#2ea8ff; --good:#37c26b; --star:#ffc531; --coin:#ffb400; --btn:rgba(255,250,240,.88);
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
[hidden]{display:none!important;}
button{font-family:inherit;cursor:pointer;border:0;}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;}
.pill{background:var(--btn);border-radius:999px;padding:6px 14px;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,.2);white-space:nowrap;}

/* ---------- 로딩 ---------- */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#8fd3ff,#d8f1ff);font-size:26px;color:#1f5f8f;}
#loading .car{font-size:70px;animation:drive 1s infinite alternate ease-in-out;}
@keyframes drive{from{transform:translateX(-30px)}to{transform:translateX(30px)}}

/* ---------- 차고(선택) 화면 ---------- */
#garage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;pointer-events:none;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;}
#garage > *{pointer-events:auto;}
#gTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
#gTop h1{font-size:clamp(28px,5.5vw,46px);margin:0;color:#fff;text-shadow:3px 3px 0 var(--accent),5px 6px 0 rgba(0,0,0,.18);}
#gWallet{display:flex;gap:8px;}
#gInfo{align-self:center;margin-top:2px;background:var(--btn);border-radius:22px;padding:12px 22px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.2);max-width:min(420px,100%);}
#gName{font-size:clamp(26px,5vw,36px);color:var(--ink);}
#gJob{font-size:clamp(15px,3vw,19px);color:var(--muted);margin-top:2px;}
#gStat{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:15px;color:var(--muted);}
.bar{display:inline-block;width:70px;height:9px;border-radius:5px;background:#e7ddc9;vertical-align:middle;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent2);}
#gBottom{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:auto;}
#gCards{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:8px 4px;scrollbar-width:none;}
#gCards::-webkit-scrollbar{display:none;}
.vcard{flex:0 0 auto;width:88px;height:96px;border-radius:18px;background:var(--btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #d9c7a0,0 6px 12px rgba(0,0,0,.15);position:relative;}
.vcard .em{font-size:38px;line-height:1;}
.vcard .nm{font-size:15px;}
.vcard .lk{font-size:12px;color:#a06a00;}
.vcard.sel{outline:4px solid var(--accent);transform:translateY(-4px);}
.vcard.locked .em{filter:grayscale(1) opacity(.55);}
#gGo{background:var(--accent);color:#fff;font-size:clamp(22px,4.5vw,30px);border-radius:999px;padding:12px 44px;box-shadow:0 6px 0 #c95a1a,0 10px 18px rgba(0,0,0,.25);transition:transform .1s;}
#gGo:active{transform:translateY(4px);box-shadow:0 2px 0 #c95a1a;}
#gGo.lock{background:#8f8478;box-shadow:0 6px 0 #5f564d;}
#gHow{font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center;}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;gap:8px;pointer-events:none;}
#hud > div{display:flex;gap:8px;align-items:flex-start;pointer-events:auto;flex-wrap:wrap;}
#hudR{flex-direction:column;align-items:flex-end;}
#hudR .btns{display:flex;gap:8px;}
#hud button{background:var(--btn);border-radius:999px;padding:6px 12px;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,.2);}
#mini{width:120px;height:120px;border-radius:16px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);background:#6fbf5f;}
#hudStars{color:#a06a00;} #hudCoins{color:#9a5b00;}
#task{position:absolute;left:50%;transform:translateX(-50%);top:58px;background:#fff;border-radius:16px;padding:8px 16px;font-size:clamp(15px,2.8vw,20px);
  box-shadow:0 4px 10px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;max-width:calc(100% - 300px);box-sizing:border-box;pointer-events:none;}
@media (max-width:640px){#task{top:auto;bottom:150px;max-width:calc(100% - 32px);}}
#taskDist{color:var(--accent2);font-variant-numeric:tabular-nums;white-space:nowrap;}
#speed{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:4px 14px;font-size:16px;font-variant-numeric:tabular-nums;pointer-events:none;}
#msg{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);background:#fff;border:5px solid var(--star);border-radius:24px;
  padding:14px 22px;font-size:clamp(18px,3.4vw,28px);text-align:center;max-width:min(560px,calc(100% - 40px));box-sizing:border-box;
  box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;line-height:1.35;text-wrap:balance;}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
#prog{position:absolute;left:50%;transform:translateX(-50%);bottom:200px;width:min(320px,70%);height:22px;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;border:3px solid #fff;}
#progBar{height:100%;width:0;background:linear-gradient(90deg,#3cb4ff,#63e0ff);transition:width .1s linear;}
#kbHint{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;}
.float{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:34px;color:var(--coin);text-shadow:2px 2px 0 #fff,0 4px 8px rgba(0,0,0,.3);pointer-events:none;animation:floatUp 1.4s forwards;}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

/* ---------- 터치 조작 ---------- */
#ctl{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;}
.pad{display:flex;gap:12px;align-items:flex-end;pointer-events:auto;}
.pad.right{flex-direction:column;align-items:flex-end;}
.pad .row{display:flex;gap:12px;}
.cbtn{width:68px;height:68px;border-radius:50%;background:var(--btn);font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;touch-action:none;}
.cbtn.wide{width:120px;border-radius:34px;font-size:22px;}
.cbtn.act{background:#ffe08a;}
.cbtn.gas{background:#bff5c8;}
.cbtn.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25);filter:brightness(.92);}
@media (max-width:480px){.cbtn{width:60px;height:60px;font-size:26px}.cbtn.wide{width:100px;font-size:19px}}
@media (prefers-reduced-motion:reduce){#msg,#gGo,.vcard{transition:none}#loading .car{animation:none}}
</style>

<div id="wrap">
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>

  <div id="loading"><div class="car">🚓</div><div>도시를 만드는 중...</div></div>

  <div id="garage" hidden>
    <div id="gTop">
      <h1>씽씽 직업 자동차</h1>
      <div id="gWallet"><span class="pill" id="gStars">⭐ 0</span><span class="pill" id="gCoins">🪙 0</span></div>
    </div>
    <div id="gInfo">
      <div id="gName">경찰차</div>
      <div id="gJob">도망가는 도둑 차를 쫓아가 잡아요</div>
      <div id="gStat"><span>속도 <span class="bar"><i id="stSpd"></i></span></span><span>힘 <span class="bar"><i id="stPow"></i></span></span></div>
    </div>
    <div id="gBottom">
      <div id="gCards"></div>
      <button id="gGo" type="button">🚗 운전하기</button>
      <div id="gHow">임무를 끝내면 🪙 코인과 ⭐ 별을 받아요. 코인으로 새 자동차를 열어요!</div>
    </div>
  </div>

  <div id="hud" hidden>
    <div><span class="pill" id="hudCar">🚓 경찰차</span><span class="pill" id="hudStars">⭐ 0</span><span class="pill" id="hudCoins">🪙 0</span></div>
    <div id="hudR"><canvas id="mini" width="240" height="240"></canvas><div class="btns"><button id="bMute" type="button" aria-label="소리 끄기/켜기">🔊</button><button id="bSwap" type="button">🏠 차고</button></div></div>
  </div>
  <div id="task" hidden><span id="taskText"></span><span id="taskDist"></span></div>
  <div id="speed" hidden>0 km/h</div>
  <div id="msg"></div>
  <div id="prog" hidden><div id="progBar"></div></div>
  <div id="kbHint" hidden>키보드: 방향키(또는 WASD)로 운전 · 스페이스 = 특별 버튼</div>

  <div id="ctl" hidden>
    <div class="pad">
      <button class="cbtn" id="bL" type="button" aria-label="왼쪽으로">◀</button>
      <button class="cbtn" id="bR" type="button" aria-label="오른쪽으로">▶</button>
    </div>
    <div class="pad right">
      <button class="cbtn act" id="bA" type="button" aria-label="특별 버튼">🚨</button>
      <div class="row">
        <button class="cbtn" id="bB" type="button" aria-label="후진">🔽</button>
        <button class="cbtn wide gas" id="bG" type="button" aria-label="출발">🚀 출발</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T=window.THREE;
const $=s=>document.querySelector(s);
const canvas=$('#game'), fx=$('#fx'), fxc=fx.getContext('2d'), mini=$('#mini'), mc=mini.getContext('2d');
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
if(!T){ $('#loading').innerHTML='<div>3D 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>'; return; }

// ---------- 도시 크기 (1단위 = 1m) ----------
const N=6, BLOCK=32, ROAD=11, CELL=BLOCK+ROAD, WORLD=N*CELL+ROAD, L=ROAD/4;
const rc=i=>ROAD/2+i*CELL, bo=i=>ROAD+i*CELL;
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function lerpAngle(a,b,t){let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return a+d*t;}
function rectDist(px,pz,b){const cx=clamp(px,b.x,b.x+b.w), cz=clamp(pz,b.z,b.z+b.d); return Math.hypot(px-cx,pz-cz);}
function isRoad(x,z){ if(x<0||z<0||x>=WORLD||z>=WORLD) return false; return (x%CELL)<ROAD||(z%CELL)<ROAD; }

// ---------- 자동차 종류 ----------
const VEHICLES=[
 {id:'police',emoji:'🚓',name:'경찰차',job:'도망가는 도둑 차를 쫓아가 잡아요',color:0xf4f6fb,len:4.6,wid:2.1,max:30,acc:16,cost:0,reward:12,action:'siren',actionLabel:'🚨'},
 {id:'taxi',emoji:'🚕',name:'택시',job:'손님을 태우고 목적지까지 달려요',color:0xffc722,len:4.5,wid:2.1,max:27,acc:15,cost:0,reward:10,action:'horn',actionLabel:'📣'},
 {id:'ambulance',emoji:'🚑',name:'구급차',job:'다친 사람을 병원으로 데려가요',color:0xffffff,len:5.2,wid:2.3,max:28,acc:15,cost:20,reward:14,action:'siren',actionLabel:'🚨'},
 {id:'fire',emoji:'🚒',name:'소방차',job:'불이 난 가게에 물을 뿌려 불을 꺼요',color:0xe63b3b,len:6.2,wid:2.4,max:24,acc:14,cost:30,reward:16,action:'water',actionLabel:'💦'},
 {id:'delivery',emoji:'🚚',name:'택배차',job:'창고에서 택배를 싣고 집까지 배달해요',color:0x8d6e63,len:5.4,wid:2.3,max:25,acc:14,cost:40,reward:14,action:'horn',actionLabel:'📣'},
 {id:'garbage',emoji:'🚛',name:'청소차',job:'길에 떨어진 쓰레기를 치워요',color:0x4caf50,len:6.0,wid:2.4,max:23,acc:13,cost:50,reward:18,action:'horn',actionLabel:'📣'},
 {id:'bus',emoji:'🚌',name:'버스',job:'정류장을 돌며 승객을 태워요',color:0x3fa9f5,len:7.5,wid:2.5,max:22,acc:12,cost:60,reward:20,action:'horn',actionLabel:'📣'},
 {id:'tow',emoji:'🛻',name:'견인차',job:'고장난 차를 정비소로 끌고 가요',color:0xff8c1a,len:5.2,wid:2.3,max:25,acc:14,cost:80,reward:22,action:'horn',actionLabel:'📣'},
];
const FINISH={police:'🚔 도둑을 잡았어요!',fire:'💦 불을 다 껐어요!',ambulance:'🏥 환자를 병원에 데려다줬어요!',taxi:'🚕 손님이 목적지에 도착했어요!',
  bus:'🚌 정류장을 모두 돌았어요!',garbage:'🗑️ 쓰레기를 다 치웠어요! 도시가 반짝반짝!',delivery:'📦 택배를 잘 배달했어요!',tow:'🔧 고장난 차를 정비소에 데려왔어요!'};
const PRAISE=['최고예요!','정말 멋져요!','대단해요!','훌륭해요!','짱이에요!','완벽해요!'];

// ---------- 저장 ----------
let stars=0, coins=0, unlocked=['police','taxi'];
try{ const s=JSON.parse(localStorage.getItem('ssc3d')||'{}'); stars=s.stars|0; coins=s.coins|0; if(Array.isArray(s.unlocked)) unlocked=s.unlocked; }catch(e){}
function save(){ try{ localStorage.setItem('ssc3d',JSON.stringify({stars,coins,unlocked})); }catch(e){} }

// ---------- 도시 데이터 ----------
const PAL=[0xffb3a7,0xffd59e,0xfff3a3,0xc8f7c5,0xa7e4ff,0xd6c2ff,0xffc6e6,0xf7d9b0,0xb5ead7,0xffdac1];
const ROOF=[0xe07a6a,0xe0a45e,0xd9c34d,0x7cc38a,0x6aaed6,0x9a86d6,0xd67aa9,0xc9a06e,0x6fbf9f,0xe89a7a];
const SHOPS=[['🍞','빵집'],['☕','카페'],['🍕','피자가게'],['🌸','꽃집'],['🧸','장난감가게'],['📚','서점'],['🍦','아이스크림가게'],['🏪','편의점'],['🍔','햄버거가게'],
 ['🏠','파란지붕집'],['🏡','노란집'],['🐶','동물병원'],['🎨','미술학원'],['🎹','피아노학원'],['📮','우체국'],['🛒','마트'],['🏠','빨간지붕집'],['🍜','국수집'],
 ['🎂','케이크가게'],['👕','옷가게'],['🏠','하얀집'],['🍎','과일가게'],['🎮','게임가게'],['🏠','초록지붕집'],['🍩','도넛가게'],['🧁','컵케이크가게'],['🚲','자전거가게'],['🏠','분홍집'],
 ['🏢','사무실'],['🍣','초밥집'],['🎈','파티용품점'],['🧃','주스가게']];
const SPECIAL={
 '0,2':{icon:'🏥',name:'병원',kind:'hospital',color:0xffffff,roof:0xff6b6b,h:12},
 '5,3':{icon:'👮',name:'경찰서',kind:'police',color:0xdbe7ff,roof:0x3b5bdb,h:9},
 '2,0':{icon:'🧯',name:'소방서',kind:'firestation',color:0xffb3b3,roof:0xe03131,h:8},
 '3,5':{icon:'🔧',name:'정비소',kind:'garage',color:0xe9ecef,roof:0x495057,h:6},
 '5,0':{icon:'📦',name:'물류창고',kind:'warehouse',color:0xffe8cc,roof:0xe8590c,h:7},
 '3,2':{icon:'🏫',name:'학교',kind:'school',color:0xfff4e6,roof:0xf59f00,h:8},
 '2,3':{kind:'park',name:'놀이공원',icon:'🎠'},
 '0,5':{kind:'park',name:'호수공원',icon:'⛲'},
};
const buildings=[], solids=[], trees=[], parks=[];
(function genCity(){
  let shopIdx=0;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const sp=SPECIAL[i+','+j], x0=bo(i), z0=bo(j);
    if(sp&&sp.kind==='park'){
      parks.push({x:x0,z:z0,w:BLOCK,d:BLOCK,name:sp.name,icon:sp.icon});
      for(let k=0;k<10;k++){ const tx=x0+rand(3,BLOCK-3), tz=z0+rand(3,BLOCK-3); if(dist(tx,tz,x0+BLOCK/2,z0+BLOCK/2+2)<9) continue; trees.push({x:tx,z:tz,s:rand(0.9,1.4)}); }
      continue;
    }
    if(sp){
      const w=22,d=17;
      const b=Object.assign({x:x0+(BLOCK-w)/2,z:z0+(BLOCK-d)/2,w,d,i,j,big:true},sp);
      buildings.push(b); solids.push(b);
      [[3,3],[BLOCK-3,3],[3,BLOCK-3],[BLOCK-3,BLOCK-3]].forEach(p=>trees.push({x:x0+p[0],z:z0+p[1],s:1.1}));
      continue;
    }
    const M=2.4, q=(BLOCK-3*M)/2; let count=0;
    for(let qx=0;qx<2;qx++) for(let qz=0;qz<2;qz++){
      const cx=x0+M+qx*(q+M)+q/2, cz=z0+M+qz*(q+M)+q/2;
      if(Math.random()<0.2&&(count>0||qx+qz<2)){ trees.push({x:cx,z:cz,s:1.3}); trees.push({x:cx-3.5,z:cz+2.5,s:0.9}); trees.push({x:cx+3,z:cz-2,s:1}); continue; }
      const w=rand(8.5,q), d=rand(8,q), h=rand(5,13);
      const s=SHOPS[shopIdx++%SHOPS.length], c=ri(0,PAL.length-1);
      const b={x:cx-w/2,z:cz-d/2,w,d,h,icon:s[0],name:s[1],kind:'shop',color:PAL[c],roof:ROOF[c],i,j};
      buildings.push(b); solids.push(b); count++;
    }
  }
})();
const byKind=k=>buildings.find(b=>b.kind===k);

// ---------- 도로 위 자동차 AI ----------
const DX=[1,0,-1,0], DZ=[0,1,0,-1];
const NPC_COLORS=[0xff6b6b,0x4dabf7,0xffd43b,0x69db7c,0xda77f2,0xff922b,0xe9ecef,0x20c997,0x845ef7];
function lanePt(d,i,j){ const cx=rc(i),cz=rc(j); return d===0?{x:cx,z:cz+L}:d===1?{x:cx-L,z:cz}:d===2?{x:cx,z:cz-L}:{x:cx+L,z:cz}; }
function makeRoadCar(){
  const ti=ri(0,N), tj=ri(0,N), dir=ri(0,3), p=lanePt(dir,ti,tj);
  return {x:p.x,z:p.z,ti,tj,dir,angle:dir*Math.PI/2,speed:rand(7,11),color:pick(NPC_COLORS)};
}
function stepRoadCar(c,dt,prefer){
  const t=lanePt(c.dir,c.ti,c.tj);
  const dx=t.x-c.x, dz=t.z-c.z, d=Math.hypot(dx,dz), mv=c.speed*dt;
  if(d<=mv+0.05){
    c.x=t.x; c.z=t.z;
    let opts=[];
    for(let k=0;k<4;k++){ const ni=c.ti+DX[k], nj=c.tj+DZ[k]; if(ni<0||ni>N||nj<0||nj>N) continue; if(k===(c.dir+2)%4) continue; opts.push(k); }
    if(!opts.length) opts=[(c.dir+2)%4];
    let nd;
    if(prefer){ nd=opts[0]; let bs=-1e9; for(const k of opts){ const s=prefer(k,c.ti+DX[k],c.tj+DZ[k]); if(s>bs){bs=s;nd=k;} } }
    else nd=(opts.includes(c.dir)&&Math.random()<0.55)?c.dir:pick(opts);
    c.dir=nd; c.ti+=DX[nd]; c.tj+=DZ[nd];
  } else {
    c.x+=dx/d*mv; c.z+=dz/d*mv;
    c.angle=lerpAngle(c.angle,Math.atan2(dz,dx),Math.min(1,dt*6));
  }
}

const sfx=(()=>{
  let ac=null, master=null, engine=null, engGain=null, siren=null, sirenGain=null, sirenTimer=null, water=null, waterGain=null, muted=false;

      engine=ac.createOscillator(); engine.type='sawtooth'; engine.frequency.value=55;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
      engGain=ac.createGain(); engGain.gain.value=0; engine.connect(lp); lp.connect(engGain); engGain.connect(master); engine.start();
      siren=ac.createOscillator(); siren.type='sine'; siren.frequency.value=650;
      sirenGain=ac.createGain(); sirenGain.gain.value=0; siren.connect(sirenGain); sirenGain.connect(master); siren.start();
      const len=ac.sampleRate; const buf=ac.createBuffer(1,len,ac.sampleRate); const ch=buf.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
      water=ac.createBufferSource(); water.buffer=buf; water.loop=true;

      waterGain=ac.createGain(); waterGain.gain.value=0; water.connect(bp); bp.connect(waterGain); waterGain.connect(master); water.start();
    }catch(e){ ac=null; }
  }
  function resume(){ if(ac&&ac.state==='suspended') ac.resume(); }
  function tone(f,dur,type,vol,when){ if(!ac) return; const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f;
    const t=ac.currentTime+(when||0); g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }

    coin(){ tone(1568,0.08,'square',0.08); tone(2093,0.14,'square',0.08,0.08); },

    fireSprites.forEach((s,k)=>{ s.visible=true; s.position.set(b.x+b.w*(0.15+0.175*k),0.3+b.h+1.2,b.z+b.d*(k%2?0.25:0.75)); s.userData.k=k; });
    fireLight.position.set(b.x+b.w/2,0.3+b.h+3,b.z+b.d/2);
    say(`🔥 ${b.name}에 불이 났어요! 가까이 가서 💦 버튼을 꾹 눌러 불을 꺼요!`); m.task=`🔥 ${b.name}의 불을 꺼요!`;
  } else if(id==='ambulance'){
    const p=randomRoadPoint(60), h=byKind('hospital');
    m.targets=[Object.assign(p,{icon:'🤕',carry:'🤕',msg:'🤕 다친 사람을 태웠어요! 🏥 병원으로 빨리 가요!',task:'🏥 병원으로 가요!'}),Object.assign(frontOf(h),{icon:'🏥',b:h})];
    say(`🤕 ${nearName(p)} 근처에 다친 사람이 있어요! 빨리 데리러 가요!`); m.task='🤕 다친 사람을 데리러 가요!';
  } else if(id==='taxi'){
    const p=randomRoadPoint(50); const d=pick(buildings.filter(b=>dist(b.x,b.z,p.x,p.z)>50));
    m.targets=[Object.assign(p,{icon:'🙋',carry:'🙋',msg:`🙋 손님이 탔어요! ${d.name}까지 태워다 주세요!`,task:`📍 ${d.name}으로 가요!`}),Object.assign(frontOf(d),{icon:'🏁',b:d})];
    say(`🙋 ${nearName(p)} 근처에서 손님이 기다려요! 데리러 가요!`); m.task='🙋 손님을 데리러 가요!';
  } else if(id==='bus'){
    let prev={x:car.x,z:car.z};
    for(let k=0;k<3;k++){ let p; for(let t=0;t<30;t++){ p=randomRoadPoint(30); if(dist(p.x,p.z,prev.x,prev.z)>45) break; }
      m.targets.push(Object.assign(p,{icon:'🚏',msg:`🙋 승객이 탔어요! 다음 정류장으로 가요! (${k+2}/3)`,task:`🚏 정류장 ${k+2}/3`})); prev=p; }
    say('🚌 정류장 3곳을 돌며 승객을 태워요! 첫 번째 정류장으로 출발!'); m.task='🚏 정류장 1/3';
  } else if(id==='garbage'){
    m.kind='collect'; m.left=5;
    for(let k=0;k<5;k++) m.targets.push(Object.assign(randomRoadPoint(25),{icon:'🗑️',done:false}));
    say('🗑️ 길에 쓰레기 봉투 5개가 떨어져 있어요! 모두 치워요!'); m.task='🗑️ 쓰레기 5개 남음';
  } else if(id==='delivery'){
    const w=byKind('warehouse'), d=shopFar();
    m.targets=[Object.assign(frontOf(w),{icon:'📦',b:w,carry:'📦',msg:`📦 택배를 실었어요! ${d.name}으로 배달 가요!`,task:`🏠 ${d.name}에 배달해요!`}),Object.assign(frontOf(d),{icon:'🏁',b:d})];
    say('📦 물류창고에 가서 택배를 실어요!'); m.task='📦 물류창고로 가요!';
  } else if(id==='tow'){
    const p=randomRoadPoint(60), g=byKind('garage');
    m.targets=[Object.assign(p,{icon:'🚗',carry:'tow',msg:'🔗 고장난 차를 연결했어요! 🔧 정비소로 끌고 가요!',task:'🔧 정비소로 끌고 가요!'}),Object.assign(frontOf(g),{icon:'🔧',b:g})];
    car.towAngle=car.angle;
    say(`🚗💨 ${nearName(p)} 근처에 고장난 차가 있어요! 견인하러 가요!`); m.task='🚗 고장난 차를 찾으러 가요!';
  }
  mission=m; placeMarkers(m); updateTask();
}
function complete(){
  const m=mission; m.done=true; const rw=car.v.reward; stars++; coins+=rw; save(); updateWallet();
  sfx.success(); setTimeout(()=>sfx.coin(),500); sfx.waterSet(false); spawnConfetti(); floatText(`🪙 +${rw}   ⭐ +1`);
  say(`🎉 ${FINISH[car.v.id]} ${pick(PRAISE)}`,3000);
  m.task='🎉 임무 완료!'; updateTask(); markers.forEach(mk=>mk.hide()); fireSprites.forEach(s=>s.visible=false); fireLight.intensity=0; arrow.visible=false;
  if(towMesh){ scene.remove(towMesh); towMesh=null; } if(towRope){ scene.remove(towRope); towRope=null; }
  if(thiefMesh){ scene.remove(thiefMesh); thiefMesh=null; } if(thiefTag){ scene.remove(thiefTag); thiefTag=null; }
  setTimeout(()=>{ if(running&&mission===m) newMission(); },3000);
}
function currentTarget(){
  const m=mission; if(!m||m.done) return null;
  if(m.kind==='chase') return m.thief;
  if(m.kind==='collect'){ let best=null,bd=1e9; for(const t of m.targets) if(!t.done){ const d=dist(t.x,t.z,car.x,car.z); if(d<bd){bd=d;best=t;} } return best; }
  return m.targets[m.idx]||null;
}
function updateMission(dt){
  const m=mission; if(!m||m.done){ el.prog.hidden=true; return; }
  if(m.kind==='chase'){
    stepRoadCar(m.thief,dt,(k,ni,nj)=>{ const p=lanePt(k,ni,nj); return dist(p.x,p.z,car.x,car.z)+Math.random()*12; });
    thiefMesh.position.set(m.thief.x,0,m.thief.z); thiefMesh.rotation.y=-m.thief.angle; thiefTag.position.set(m.thief.x,3.6+Math.sin(time*6)*0.3,m.thief.z);
    thiefMesh.userData.wheels.forEach(w=>w.w.rotation.z-=m.thief.speed*dt/0.42);
    if(dist(m.thief.x,m.thief.z,car.x,car.z)<5) complete();
  } else if(m.kind==='fire'){
    const near=rectDist(car.x,car.z,m.fireB)<12;
    if(input.action&&near){ m.hold+=dt; if(m.hold>=m.need){ el.prog.hidden=true; complete(); return; } }
    el.prog.hidden=!(near||m.hold>0); el.progBar.style.width=(m.hold/m.need*100)+'%';
    const k=1-m.hold/m.need; fireSprites.forEach((s,i)=>{ const sc=(2.4+Math.sin(time*9+i)*0.7)*(0.3+0.7*k); s.scale.set(sc,sc*1.3,1); }); fireLight.intensity=(1.2+Math.sin(time*13)*0.5)*k;
    if(Math.random()<0.6*k){ const b=m.fireB; smokeP.list.push({x:rand(b.x+1,b.x+b.w-1),y:0.3+b.h+1.5,z:rand(b.z+1,b.z+b.d-1),vx:rand(-0.5,0.5),vy:rand(2,3.5),vz:rand(-0.5,0.5),t:0,life:rand(1.5,2.5)}); }
  } else if(m.kind==='collect'){
    for(const t of m.targets) if(!t.done&&dist(t.x,t.z,car.x,car.z)<4.5){ t.done=true; m.left--; sfx.pickup(); if(t.mk) t.mk.hide();
      if(m.left===0){ complete(); return; } m.task=`🗑️ 쓰레기 ${m.left}개 남음`; updateTask(); say(`👍 ${m.left}개 남았어요!`,1500); }
  } else {
    const t=m.targets[m.idx];
    if(t&&dist(t.x,t.z,car.x,car.z)<5.5){
      if(t.carry) m.carry=t.carry;
      if(t.carry==='tow'){ towMesh=buildVehicle(Object.assign({},SEDAN,{color:0xadb5bd})); scene.add(towMesh); const g=new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3()]); towRope=new T.Line(g,new T.LineBasicMaterial({color:0x333333})); scene.add(towRope); car.towAngle=car.angle; }
      m.idx++;
      if(m.idx>=m.targets.length) complete();
      else { sfx.pickup(); say(t.msg); m.task=t.task; updateTask(); buildings.forEach(b=>{ if(b.mesh) b.mesh.material[0].emissive.setHex(0); }); placeMarkers(m); }
    }
  }
}

// ---------- 입력 ----------
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'action'};
window.addEventListener('keydown',e=>{ const k=KEYS[e.code]; if(k){ e.preventDefault(); if(!input[k]){ input[k]=true; if(k==='action') actionPress(); } }
  if(e.code==='KeyM'){ $('#bMute').click(); } if(e.code==='Escape'&&running) showGarage(); });
window.addEventListener('keyup',e=>{ const k=KEYS[e.code]; if(k){ e.preventDefault(); input[k]=false; } });
function bindBtn(id,key){
  const b=$(id);
  const on=e=>{ e.preventDefault(); sfx.resume(); if(!input[key]){ input[key]=true; if(key==='action') actionPress(); } b.classList.add('on'); try{ b.setPointerCapture(e.pointerId); }catch(x){} };
  const off=e=>{ e.preventDefault(); input[key]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('#bL','left'); bindBtn('#bR','right'); bindBtn('#bG','gas'); bindBtn('#bB','brake'); bindBtn('#bA','action');
function actionPress(){
  if(!running) return; const a=car.v.action;
  if(a==='siren'){ car.sirenOn=!car.sirenOn; sfx.sirenSet(car.sirenOn); }
  else if(a==='horn'){ if(hornCd<=0){ sfx.horn(); hornCd=0.3; } }
}

// ---------- 물리 ----------
function updateCar(dt){
  const v=car.v;
  if(input.gas) car.speed+=v.acc*dt;
  else if(input.brake) car.speed-=v.acc*0.8*dt;
  else car.speed-=Math.sign(car.speed)*Math.min(Math.abs(car.speed),9*dt);
  const onRoad=isRoad(car.x,car.z), maxS=onRoad?v.max:v.max*0.5;
  if(car.speed>maxS) car.speed=Math.max(maxS,car.speed-40*dt);
  if(car.speed<-maxS*0.4) car.speed=Math.min(-maxS*0.4,car.speed+40*dt);
  const steer=(input.right?1:0)-(input.left?1:0);
  car.steerVis+=(steer-car.steerVis)*Math.min(1,dt*10);
  const sf=clamp(Math.abs(car.speed)/9,0,1);
  car.angle+=steer*2.3*sf*(car.speed<0?-1:1)*dt;
  const ca=Math.cos(car.angle), sa=Math.sin(car.angle);
  car.x+=ca*car.speed*dt; car.z+=sa*car.speed*dt;
  if(car.x<3){car.x=3;car.speed*=-0.3;} if(car.x>WORLD-3){car.x=WORLD-3;car.speed*=-0.3;}
  if(car.z<3){car.z=3;car.speed*=-0.3;} if(car.z>WORLD-3){car.z=WORLD-3;car.speed*=-0.3;}
  const r=v.wid*0.62, off=v.len*0.32; let hit=false;
  for(let n=0;n<2;n++){
    const px=car.x+ca*off*(n?-1:1), pz=car.z+sa*off*(n?-1:1);
    for(const b of solids){
      if(px<b.x-r||px>b.x+b.w+r||pz<b.z-r||pz>b.z+b.d+r) continue;
      const cx=clamp(px,b.x,b.x+b.w), cz=clamp(pz,b.z,b.z+b.d);
      const dx=px-cx, dz=pz-cz, d=Math.hypot(dx,dz);
      if(d===0){ const l=px-b.x, rr=b.x+b.w-px, t=pz-b.z, bb=b.z+b.d-pz, m=Math.min(l,rr,t,bb);
        if(m===l){car.x-=m+r;} else if(m===rr){car.x+=m+r;} else if(m===t){car.z-=m+r;} else {car.z+=m+r;} hit=true; }
      else if(d<r){ car.x+=dx/d*(r-d); car.z+=dz/d*(r-d); hit=true; }
    }
  }
  for(const c of npcs){ const d=dist(c.x,c.z,car.x,car.z); if(d<3.2&&d>0.01){ const k=(3.2-d); car.x+=(car.x-c.x)/d*k; car.z+=(car.z-c.z)/d*k; if(Math.abs(car.speed)>6) hit=true; car.speed*=0.6; } }
  if(hit){ if(Math.abs(car.speed)>6&&bonkCd<=0){ sfx.bonk(); bonkCd=0.3; } car.speed*=-0.25; }
  // 모델 갱신
  const mesh=car.mesh; mesh.position.set(car.x,0,car.z); mesh.rotation.y=-car.angle;
  const body=mesh.userData.body; body.rotation.x=car.steerVis*clamp(car.speed/v.max,-1,1)*0.06; body.rotation.z=(input.gas?-0.02:input.brake?0.03:0);
  mesh.userData.wheels.forEach(w=>{ w.w.rotation.z-=car.speed*dt/0.42; if(w.front) w.piv.rotation.y=-car.steerVis*0.45; });
  if(mesh.userData.lb){ const on=car.sirenOn, f=Math.floor(time*8)%2===0; mesh.userData.lb[0].material=mat(0xff3b3b,{emissive:0xff3b3b,emissiveIntensity:on&&f?1.6:0.3}); mesh.userData.lb[1].material=mat(0x3b6bff,{emissive:0x3b6bff,emissiveIntensity:on&&!f?1.6:0.3}); }
  // 견인
  if(towMesh){ const tx=car.x-ca*(v.len/2+3.4), tz=car.z-sa*(v.len/2+3.4);
    car.towAngle=lerpAngle(car.towAngle,Math.atan2(car.z-tz,car.x-tx),Math.min(1,dt*3));
    towMesh.position.set(tx,0,tz); towMesh.rotation.y=-car.towAngle; towMesh.userData.wheels.forEach(w=>w.w.rotation.z-=car.speed*dt/0.42);
    const p=towRope.geometry.attributes.position; p.setXYZ(0,car.x-ca*(v.len/2+0.6),1.3,car.z-sa*(v.len/2+0.6)); p.setXYZ(1,tx+Math.cos(car.towAngle)*2,1.0,tz+Math.sin(car.towAngle)*2); p.needsUpdate=true; }
  // 물 뿌리기
  const spraying=v.action==='water'&&input.action; sfx.waterSet(spraying);
  if(spraying&&waterP.list.length<380){ for(let k=0;k<6;k++){ const a=car.angle+rand(-0.18,0.18), sp=rand(16,24);
    waterP.list.push({x:car.x+ca*v.len/2,y:1.5,z:car.z+sa*v.len/2,vx:Math.cos(a)*sp+ca*car.speed,vy:rand(7,10),vz:Math.sin(a)*sp+sa*car.speed,t:0,life:2}); } }
  sfx.engine(clamp(Math.abs(car.speed)/v.max,0,1),true);
  el.speed.textContent=Math.round(Math.abs(car.speed)*3.6)+' km/h';
}
function spawnConfetti(){ const cols=['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#da77f2','#ff922b'];
  for(let k=0;k<140;k++) confetti.push({x:rand(0,vw),y:rand(-80,-10),vx:rand(-60,60),vy:rand(40,160),rot:rand(0,TAU),vr:rand(-6,6),life:rand(2,3.2),t:0,color:pick(cols),s:rand(6,12)}); }

// ---------- 미니맵 ----------
const miniImg=document.createElement('canvas'); miniImg.width=miniImg.height=240;
(function drawMiniBase(){ const g=miniImg.getContext('2d'), s=240/WORLD; g.fillStyle='#7cc46a'; g.fillRect(0,0,240,240);
  g.fillStyle='#596069'; for(let i=0;i<=N;i++){ g.fillRect(0,(rc(i)-ROAD/2)*s,240,ROAD*s); g.fillRect((rc(i)-ROAD/2)*s,0,ROAD*s,240); }
  for(const p of parks){ g.fillStyle='#4fa8e8'; g.beginPath(); g.arc((p.x+p.w/2)*s,(p.z+p.d/2+2)*s,6*s,0,TAU); g.fill(); }
  for(const b of buildings){ g.fillStyle=b.big?'#'+b.roof.toString(16).padStart(6,'0'):'#c9bfa8'; g.fillRect(b.x*s,b.z*s,b.w*s,b.d*s); } })();
function drawMini(){ const s=240/WORLD; mc.drawImage(miniImg,0,0);
  const t=currentTarget(); if(t&&Math.floor(time*3)%2===0){ mc.fillStyle='#ffd43b'; mc.beginPath(); mc.arc(t.x*s,t.z*s,7,0,TAU); mc.fill(); mc.strokeStyle='#5c4300'; mc.lineWidth=2; mc.stroke(); }
  if(mission&&mission.kind==='collect') for(const q of mission.targets) if(!q.done){ mc.fillStyle='#ffd43b'; mc.beginPath(); mc.arc(q.x*s,q.z*s,4,0,TAU); mc.fill(); }
  mc.save(); mc.translate(car.x*s,car.z*s); mc.rotate(car.angle); mc.fillStyle='#ff7a30'; mc.strokeStyle='#fff'; mc.lineWidth=2; mc.beginPath(); mc.moveTo(9,0); mc.lineTo(-6,-6); mc.lineTo(-3,0); mc.lineTo(-6,6); mc.closePath(); mc.fill(); mc.stroke(); mc.restore(); }

// ---------- 루프 ----------
function resize(){ vw=canvas.clientWidth; vh=canvas.clientHeight; renderer.setSize(vw,vh,false); camera.aspect=vw/vh; camera.updateProjectionMatrix(); gCam.aspect=vw/vh; gCam.updateProjectionMatrix();
  fx.width=vw; fx.height=vh; gCam.position.set(vw<600?10.5:8,vw<600?4.6:3.6,vw<600?10.5:8); gCam.lookAt(0,0.2,0); }
window.addEventListener('resize',resize); resize();

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; time+=dt;
  if(mode==='garage'){ if(gModel){ gModel.rotation.y+=dt*0.7; gModel.userData.wheels.forEach(w=>w.w.rotation.z-=dt*4); } renderer.render(gScene,gCam); return; }
  if(mode!=='game') return;
  if(running){
    bonkCd-=dt; hornCd-=dt;
    updateCar(dt);
    for(const c of npcs){ stepRoadCar(c,dt); c.mesh.position.set(c.x,0,c.z); c.mesh.rotation.y=-c.angle; c.mesh.userData.wheels.forEach(w=>w.w.rotation.z-=c.speed*dt/0.42); }
    updateMission(dt);
    updatePoints(waterP,dt,-16); updatePoints(smokeP,dt,0.6);
    for(const c of clouds){ c.position.x+=c.userData.v*dt; if(c.position.x>WORLD+60) c.position.x=-60; }
    markers.forEach(m=>m.update(time));
    // 안내 화살표
    const tgt=currentTarget();
    if(tgt){ const d=dist(tgt.x,tgt.z,car.x,car.z); el.taskDist.textContent=Math.round(d)+'m';
      if(d>9){ arrow.visible=true; arrow.position.set(car.x,4.6+Math.sin(time*5)*0.25,car.z); arrow.rotation.y=-Math.atan2(tgt.z-car.z,tgt.x-car.x); } else arrow.visible=false; }
    else { el.taskDist.textContent=''; arrow.visible=false; }
    // 카메라
    const ca=Math.cos(car.angle), sa=Math.sin(car.angle), sp=clamp(Math.abs(car.speed)/car.v.max,0,1);
    const back=car.speed<-1?-1:1, cd=8.5+sp*2.5, ch=4.6+sp*1.0;
    const px=car.x-ca*cd*back, pz=car.z-sa*cd*back;
    const k=1-Math.exp(-dt*4.5);
    camPos.x+=(px-camPos.x)*k; camPos.y+=(ch-camPos.y)*k; camPos.z+=(pz-camPos.z)*k;
    camLook.x+=(car.x+ca*3*back-camLook.x)*Math.min(1,dt*8); camLook.y+=(1.2-camLook.y)*k; camLook.z+=(car.z+sa*3*back-camLook.z)*Math.min(1,dt*8);
    camera.position.copy(camPos); camera.lookAt(camLook); camera.fov=58+sp*8; camera.updateProjectionMatrix();
    sun.position.set(car.x+40,70,car.z+25); sun.target.position.set(car.x,0,car.z); sun.target.updateMatrixWorld();
    const pb=byKind('police'); if(pb&&pb.lightbar) pb.lightbar.material=mat(Math.floor(time*2)%2?0xff3b3b:0x3b6bff,{emissive:Math.floor(time*2)%2?0xff3b3b:0x3b6bff,emissiveIntensity:0.8});
    drawMini();
  }
  renderer.render(scene,camera);
  // 색종이 오버레이
  fxc.clearRect(0,0,vw,vh);
  for(let i=confetti.length-1;i>=0;i--){ const c=confetti[i]; c.t+=dt; if(c.t>c.life){ confetti.splice(i,1); continue; }
    c.vy+=300*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; fxc.save(); fxc.translate(c.x,c.y); fxc.rotate(c.rot); fxc.fillStyle=c.color; fxc.fillRect(-c.s/2,-c.s/3,c.s,c.s*0.66); fxc.restore(); }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ Object.keys(input).forEach(k=>input[k]=false); } else lastT=performance.now(); });

// 시작
el.loading.hidden=true; showGarage(); lastT=performance.now(); requestAnimationFrame(frame);
})();
</script>
